name: Web and Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed Android artifacts (requires signing secrets)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: datagraph_test
          MARIADB_USER: dgtest
          MARIADB_PASSWORD: test-only-password
          MARIADB_ROOT_PASSWORD: disposable-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: python3 scripts/standalone.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_mysql, mbstring, curl
      - run: find public ops -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python3 tests/test_migration.py
      - run: php tests/backup_test.php
      - run: php tests/mysql_inventory_test.php
      - run: php tests/installer_test.php
      - run: node tests/apps_script_test.cjs
      - run: cd dist && zip -qr ../DataGraph-Web.zip . -x 'data/*'
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: |
            DataGraph-Web.zip
            ../DataGraph-Smart-App.html
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:assembleDebug :app:lintRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-not-for-stores
          path: android/app/build/outputs/apk/debug/*.apk
  android-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_release)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require release signing for an explicitly requested release
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure ANDROID_KEYSTORE_BASE64 in repository Secrets'; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
        working-directory: android
      - name: Verify release APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Delete signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android-check, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/web-release/**/*
            artifacts/android-signed-release/**/*.apk
            artifacts/android-signed-release/**/*.aab
            artifacts/android-signed-release/**/mapping.txt
